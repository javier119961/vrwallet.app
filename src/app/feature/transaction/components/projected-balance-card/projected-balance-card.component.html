<vrw-card>
  <div>
    <div class="flex items-center mb-4">
      <div class="flex items-center gap-3">
        <div class="bg-[#056839] text-white p-1 rounded-md flex items-center justify-center">
          <i class="ki-filled ki-chart-simple"></i>
        </div>

        <h2 class="text-[18px] font-bold text-foreground">
          Projected Balance
        </h2>
      </div>
    </div>

    <div class="w-full">
      <div class="flex flex-col gap-1">

        <div class="flex flex-col">
          <p class="text-sm text-muted-foreground">
            Current Balance
          </p>

          <span class="text-sm font-semibold text-foreground">
            {{ currentBalance() | currency:'MXN' }}
          </span>
        </div>

        <p class="text-sm text-muted-foreground font-medium">
          New Balance After Transaction
        </p>

        <div class="flex justify-between items-center gap-3 w-full">
          <span class="text-[28px] font-bold tracking-tight text-foreground">
            {{ projectedBalance() | currency }}
          </span>

          <div
            [class]="percentageDifference() < 0
              ? 'text-[#C72E2E]'
              : 'text-green-600'"
            class="flex items-center text-sm font-semibold gap-0.5">

            @if (percentageDifference() < 0) {
              <i class="ki-filled ki-arrow-down-refraction"></i>
            } @else if (percentageDifference() > 0) {
              <i class="ki-filled ki-arrow-up-refraction"></i>
            }

            <span>
              {{ percentageDifference() | percent:'1.1-2' }}
            </span>
          </div>
        </div>

      </div>
    </div>
  </div>
</vrw-card>
